name: Compilar APK TaskFlow

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Permite disparar a compilação manualmente no GitHub

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar o Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Dependências Web
        run: npm ci

      - name: Compilar Aplicação Web (Next.js / Vite)
        run: npm run build

      - name: Sincronizar com Capacitor
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilar APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Disponibilizar Ficheiro APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
